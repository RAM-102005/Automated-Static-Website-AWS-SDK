<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Automated Static Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
        }

        header {
            background: #232f3e;
            color: white;
            padding: 25px;
        }

        .container {
            margin: 80px auto;
            max-width: 700px;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 20px;
        }

        h2 {
            color: #232f3e;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            line-height: 1.7;
        }

        .status {
            margin-top: 25px;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 8px;
            font-weight: bold;
        }

        footer {
            margin-top: 50px;
            color: #555;
        }
    </style>
</head>

<body>

<header>
    <h1>AWS Automated Static Website</h1>
</header>

<div class="container">

    <h2>Deployment Successful 🚀</h2>

    <p>
        This static website is automatically deployed to
        Amazon S3 using Python and Boto3.
    </p>

    <div class="status">
        AWS S3 + Python + Boto3
    </div>

</div>

<footer>
    AWS Capstone Project
</footer>

</body>
</html>
